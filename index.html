<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reusable Pricing Cards</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <p class="eyebrow">SIMPLE PLANS</p>
    <h1>Choose your starting point</h1>
    <p>A reusable pricing card built with HTML, CSS, and JavaScript.</p>
  </header>
  <main>
    <section class="plans" aria-label="Available pricing plans"></section>
    <p id="trial-message" role="status" aria-live="polite"></p>
    <p class="note">Demo only: no account is created and no payment is collected.</p>
  </main>
  <footer><p>Marvin's pricing card checkpoint</p></footer>
  <script src="./script.js"></script>
</body>
</html>
